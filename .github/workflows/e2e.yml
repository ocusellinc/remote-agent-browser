# Runs the e2e suite against each Vercel preview deployment.
#
# Vercel's git integration creates a GitHub deployment per commit and marks it
# successful when the preview URL is live, which triggers this workflow — no
# polling or "wait for deploy" step needed.
#
# Previews are behind Deployment Protection, so the job mints a GitHub OIDC
# id-token and the suite sends it as x-vercel-trusted-oidc-idp-token. For this
# to pass, add GitHub Actions as a Trusted Source on the Vercel project
# (Settings > Deployment Protection > Trusted Sources > External Services,
# scoped to this repository). No secrets involved.
name: e2e

on:
  deployment_status:

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Mint OIDC token for Trusted Sources
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput('token', token)
      - name: e2e against the deployment
        run: npm test
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
